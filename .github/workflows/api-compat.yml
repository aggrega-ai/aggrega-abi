name: API compatibility

# A push to main or to a release branch, or a pull request into main, fails when it
# removes or changes an item a codec exports and the version being prepared does not
# mark a breaking change against the newest release tag. An added item passes.
#
# The check is scripts/check-api-compat.sh (its --help is the contract). It runs as
# it stands at the revision the change is judged against — a pull request's base, or
# the commit a push moved the branch from — so a change cannot weaken the check
# that judges it; where that revision does not carry the check, the change's own
# copy runs. It pins and installs its own tools, and the Rust toolchain whose
# rustdoc it reads, into the per-run directory it is given.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer run of a pull request replaces the older, which judged a state the
  # pull request no longer has. A push's run is never cancelled: each push is
  # judged by the check as it stood at the commit that push moved the branch
  # from, so a push whose run another push cancelled would leave its change,
  # an edit of the check included, judged by nothing but the check it edited.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-compat:
    name: Refuse an unmarked breaking API change
    # Shared self-hosted-runner switch: set the AGGREGA_RUNNER org/repo variable to route here.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Check out with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aggrega-abi
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The pinned apidiff needs a newer Go than the module's floor.
          go-version: '1.26'
          cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.85'

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No package manager cache: a run on main or on a release branch restores
          # nothing from the Actions cache, which other workflow runs can write.
          package-manager-cache: false

      - name: Take the check from the revision the change is judged against
        env:
          JUDGED_AGAINST: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          check="$RUNNER_TEMP/check-api-compat.sh"
          if [ -n "$JUDGED_AGAINST" ] \
            && git -C aggrega-abi cat-file -e "$JUDGED_AGAINST:scripts/check-api-compat.sh" 2>/dev/null; then
            git -C aggrega-abi show "$JUDGED_AGAINST:scripts/check-api-compat.sh" > "$check"
            echo "check taken from $JUDGED_AGAINST"
          else
            cp aggrega-abi/scripts/check-api-compat.sh "$check"
            echo "the judged-against revision carries no check: the change's own copy runs"
          fi
          chmod +x "$check"

      - name: Refuse an unmarked breaking change to a codec's exported API
        run: >-
          "$RUNNER_TEMP/check-api-compat.sh"
          --tools "$RUNNER_TEMP/api-tools"
          aggrega-abi
