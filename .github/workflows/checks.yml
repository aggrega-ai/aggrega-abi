name: Checks

# The checks every push to main or to a release branch, and every pull request
# into main, runs on a GitHub-hosted runner, beside api-compat.yml. A newer push
# to the same branch or pull request cancels the run it supersedes.
#
# One job per codec, each building it and running its tests against the wire
# vectors under testdata/, which every codec is checked against:
#
#   go          go build, go vet and go test of the Go module under go/
#   rust        cargo test of the crate under rust/, on the 1.85 floor the
#               crate declares
#   typescript  npm ci and npm test of the package under typescript/, which
#               builds it and checks that its packed tarball carries its entry
#               point and licence text
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet and test the Go codec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the codecs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build, vet and test
        working-directory: go
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not formatted with gofmt: $unformatted"
            exit 1
          fi
          go test -count=1 ./...

  rust:
    name: Test the Rust codec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the codecs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.85'

      - name: Test
        working-directory: rust
        run: cargo test

  typescript:
    name: Build and test the TypeScript codec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the codecs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install, build and test
        working-directory: typescript
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
