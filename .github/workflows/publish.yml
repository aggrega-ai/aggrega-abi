name: Publish

# A final release tag vX.Y.Z publishes the codec to its registries: the crate
# aggrega-abi to crates.io and @aggrega-ai/aggrega-abi to npm. A pre-release tag
# (vX.Y.Z-rc.N) and a Go module tag (go/vX.Y.Z) publish nothing; the Go module is
# served from its tag by the Go module proxy.
#
# Both registries authenticate this workflow by trusted publishing: each one
# trusts this repository's publish.yml running in the "release" environment and
# exchanges the run's OpenID Connect token for a short-lived credential. No
# registry token is stored anywhere.
#
# aggrega-pdk's publish workflow waits until this version is visible on both
# registries before it publishes the kits that depend on it.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crate:
    name: Publish the crate to crates.io
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # The crate's toolchain floor (rust-version in rust/Cargo.toml).
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85

      - name: Refuse a package whose version is not the tag's
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-version.sh "${TAG#v}"

      - name: Package the crate
        working-directory: rust
        run: cargo package

      - name: Refuse a packed crate without the licence text
        # rust/LICENSE is a symbolic link to the repository's LICENSE; the packed
        # crate must carry the text itself.
        working-directory: rust
        env:
          TAG: ${{ github.ref_name }}
        run: |
          crate="aggrega-abi-${TAG#v}"
          if ! tar -xzOf "target/package/$crate.crate" "$crate/LICENSE" | cmp -s - ../LICENSE; then
            echo "::error::the packed crate's LICENSE is not the repository's licence text"
            exit 1
          fi
          echo "the packed crate carries the repository's licence text"

      - name: Exchange the run's identity for a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish

  npm:
    name: Publish the npm package
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Bundles npm 11.19.0; trusted publishing needs npm 11.5.1 or later.
          node-version: '24.21.0'
          # No package manager cache: this job publishes what it builds, so it restores
          # nothing from the Actions cache, which other workflow runs can write.
          package-manager-cache: false

      - name: Refuse a package whose version is not the tag's
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-version.sh "${TAG#v}"

      - name: Install dependencies
        working-directory: typescript
        run: npm ci --no-audit --no-fund

      - name: Build
        # Also copies the repository's LICENSE into the package directory.
        working-directory: typescript
        run: npm run build

      - name: Refuse a tarball without its entry point or licence text
        working-directory: typescript
        run: npm run check-pack-contents

      - name: Publish to npm
        # Lifecycle scripts stay on: prepack rebuilds the package and copies the
        # licence text into it. With trusted publishing npm attaches a provenance
        # statement on its own.
        working-directory: typescript
        run: npm publish
