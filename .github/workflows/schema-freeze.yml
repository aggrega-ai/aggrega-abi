name: Schema freeze

# On main, which holds what was last released, a push fails when it changes a
# codec generated from a schema since the newest commit main shares with dev: a
# release fast-forwards main to dev and passes, an edit made on main does not.
#
# The check is the schemas repository's own (cmd/schemagate; its usage text is the
# contract), checked out beside this repository from its dev branch. The codecs it
# protects are named by the codec generator's registries, read when the check runs
# from the generator's source in aggrega-cli, on both of that repository's release
# branches: a codec registered on either is protected, so a newly registered codec
# needs no list edited here, and dropping a registration on one branch does not
# unprotect it. The comparison reads dev from this repository's remote, so dev is
# pushed before main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  freeze:
    name: Refuse a codec change (main)
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check out with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-abi
          fetch-depth: 0
          persist-credentials: false

      - name: Mint the token that reads the sibling repositories
        # The three checkouts below read aggrega-schemas and aggrega-cli with a
        # GitHub App installation token for those two repositories alone, asking
        # for read access to their contents and nothing else. The App's secrets
        # are handed to this action and to no step, and its token to those
        # checkouts, none of which keeps it.
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            aggrega-schemas
            aggrega-cli
          permission-contents: read

      - name: Check out the schemas sibling, which carries the check
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/aggrega-schemas
          path: aggrega-schemas
          ref: dev
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Check out the codec generator's source from the CLI sibling's dev
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/aggrega-cli
          path: aggrega-cli-dev
          ref: dev
          sparse-checkout: internal/tools/typegen
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Check out the codec generator's source from the CLI sibling's main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/aggrega-cli
          path: aggrega-cli-main
          ref: main
          sparse-checkout: internal/tools/typegen
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: aggrega-schemas/go.mod
          cache: false

      - name: Build the check
        working-directory: aggrega-schemas
        run: go build -o "$RUNNER_TEMP/schemagate" ./cmd/schemagate

      - name: Refuse a codec change not brought in from dev
        run: >-
          "$RUNNER_TEMP/schemagate" freeze
          -repo aggrega-abi
          -registry aggrega-cli-dev/internal/tools/typegen/main.go
          -registry aggrega-cli-main/internal/tools/typegen/main.go
          -head "$GITHUB_SHA"
          -dev origin/dev
