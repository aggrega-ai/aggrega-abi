[package]
name = "aggrega-abi"
version = "0.9.5"
edition = "2021"
description = "Portable codec for the Aggrega Wasm plugin ABI."
license = "Apache-2.0"
repository = "https://github.com/aggrega-ai/aggrega-abi"
homepage = "https://aggrega.ai"
documentation = "https://docs.rs/aggrega-abi"
readme = "README.md"
keywords = ["aggrega", "wasm", "plugin", "abi", "codec"]
categories = ["wasm", "encoding"]
rust-version = "1.85"
# The published crate carries the sources, the README and the licence text;
# the parity tests read shared vectors kept outside the crate, so they stay out.
include = ["src/**/*.rs", "README.md", "LICENSE"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
