[package]
name = "aggrega-abi"
version = "0.9.0-rc.7"
edition = "2021"
description = "Portable codec for the Aggrega Wasm plugin ABI."
license = "Apache-2.0"
repository = "https://github.com/aggrega-ai/aggrega-abi-rust"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
